<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - 后台管理系统' : '后台管理系统'}">后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
</head>
<body>
<div id="wrapper">
    <div id="sidebar-wrapper">
        <div class="sidebar-brand">
            <a href="/">
                <i class="bi bi-gear-wide-connected"></i>
                后台管理系统
            </a>
        </div>
        <div class="sidebar-menu">
            <a href="/" class="menu-item">
                <i class="bi bi-house-door"></i>
                首页
            </a>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-gear"></i>
                系统管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/system/user" class="menu-item">
                    <i class="bi bi-person-circle"></i>
                    系统用户管理
                </a>
                <a href="/system/role" class="menu-item">
                    <i class="bi bi-people-fill"></i>
                    角色管理
                </a>
                <a href="/system/permission" class="menu-item">
                    <i class="bi bi-key-fill"></i>
                    权限管理
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-person-badge"></i>
                用户管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/agent" class="menu-item">
                    <i class="bi bi-building"></i>
                    代理商管理
                </a>
                <a href="/merchant" class="menu-item">
                    <i class="bi bi-shop"></i>
                    商户管理
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-box-seam"></i>
                产品管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/product" class="menu-item">
                    <i class="bi bi-box"></i>
                    产品信息
                </a>
                <a href="/machine" class="menu-item">
                    <i class="bi bi-hdd"></i>
                    机器信息
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item active" onclick="toggleMenu(this)">
                <i class="bi bi-wallet2"></i>
                账户管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu open">
                <a href="/agent-account" class="menu-item">
                    <i class="bi bi-credit-card"></i>
                    代理账户
                </a>
                <a href="/profit" class="menu-item">
                    <i class="bi bi-cash-stack"></i>
                    分润信息
                </a>
                <a href="/account-detail" class="menu-item">
                    <i class="bi bi-list-ul"></i>
                    账户明细
                </a>
                <a href="/statement" class="menu-item active">
                    <i class="bi bi-file-earmark-text"></i>
                    对账单
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-shuffle"></i>
                交易管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/channel" class="menu-item">
                    <i class="bi bi-link-45deg"></i>
                    通道管理
                </a>
                <a href="/transaction" class="menu-item">
                    <i class="bi bi-bar-chart-line"></i>
                    交易明细
                </a>
            </div>
        </div>
    </div>

    <div id="content-wrapper">
        <nav class="topbar">
            <div class="topbar-title" th:text="${pageTitle != null ? pageTitle : '对账单'}">对账单</div>
            <div class="topbar-user">
                <div class="dropdown">
                    <div class="user-info" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="avatar" th:text="${currentUser != null ? (currentUser.realName != null ? #strings.substring(currentUser.realName, 0, 1) : #strings.substring(currentUser.username, 0, 1)) : '管'}">管</div>
                        <div>
                            <div class="user-name" th:text="${currentUser != null ? (currentUser.realName != null ? currentUser.realName : currentUser.username) : '管理员'}">管理员</div>
                            <div class="user-role" th:text="${currentRole != null ? currentRole : '系统管理员'}">系统管理员</div>
                        </div>
                        <i class="bi bi-chevron-down"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="javascript:void(0)">
                            <i class="bi bi-person-circle"></i> 个人信息
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" style="display: inline;">
                                <button type="submit" class="dropdown-item text-danger" style="border: none; background: none; cursor: pointer; width: 100%; text-align: left;">
                                    <i class="bi bi-box-arrow-right"></i> 退出登录
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div id="page-content">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item">账户管理</li>
                    <li class="breadcrumb-item active">对账单</li>
                </ol>
            </nav>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <div class="d-flex flex-wrap gap-3">
                                <div>
                                    <label class="form-label small text-muted mb-1">开始日期</label>
                                    <input type="date" class="form-control form-control-sm" id="search-statement-startDate">
                                </div>
                                <div>
                                    <label class="form-label small text-muted mb-1">结束日期</label>
                                    <input type="date" class="form-control form-control-sm" id="search-statement-endDate">
                                </div>
                                <div>
                                    <label class="form-label small text-muted mb-1">代理商</label>
                                    <input type="text" class="form-control form-control-sm" id="search-statement-agentName" placeholder="请输入代理商名称">
                                </div>
                                <div>
                                    <label class="form-label small text-muted mb-1">状态</label>
                                    <select class="form-select form-select-sm" id="search-statement-status">
                                        <option value="">全部</option>
                                        <option value="1">已确认</option>
                                        <option value="0">待确认</option>
                                        <option value="2">有异议</option>
                                    </select>
                                </div>
                                <div class="align-self-end">
                                    <button class="btn btn-primary btn-sm" onclick="searchStatement()">
                                        <i class="bi bi-search"></i> 查询
                                    </button>
                                    <button class="btn btn-secondary btn-sm ms-2" onclick="resetStatementSearch()">
                                        <i class="bi bi-arrow-repeat"></i> 重置
                                    </button>
                                    <button class="btn btn-info btn-sm ms-2" onclick="openGenerateModal()">
                                        <i class="bi bi-file-earmark-plus"></i> 生成对账单
                                    </button>
                                    <button class="btn btn-success btn-sm ms-2" onclick="exportStatement()">
                                        <i class="bi bi-file-earmark-excel"></i> 导出
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>对账单编号</th>
                                    <th>代理商</th>
                                    <th>对账日期</th>
                                    <th>交易金额</th>
                                    <th>交易笔数</th>
                                    <th>手续费</th>
                                    <th>分润金额</th>
                                    <th>状态</th>
                                    <th>确认时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="statement-table">
                                <tr>
                                    <td colspan="9" class="text-center py-3">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <span class="small text-muted">共 <span id="statement-total">0</span> 条记录</span>
                        </div>
                        <div class="col-auto">
                            <nav id="statement-pagination"></nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="generateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">生成对账单</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="generateForm">
                    <div class="mb-3">
                        <label class="form-label">开始日期 <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="gen-startDate" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">结束日期 <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="gen-endDate" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">代理商（可选，不选则生成所有代理商）</label>
                        <input type="text" class="form-control" id="gen-agentName" placeholder="请输入代理商名称（可选）">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="generateStatement()">生成</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="objectionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">提出异议</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="objectionForm">
                    <input type="hidden" id="obj-statement-id">
                    <div class="mb-3">
                        <label class="form-label">异议说明</label>
                        <textarea class="form-control" id="obj-remark" rows="3" placeholder="请输入异议说明"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" onclick="submitObjection()">提交异议</button>
            </div>
        </div>
    </div>
</div>

<div id="loading" class="loading">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div class="toast-container position-fixed top-0 start-50 translate-middle-x" style="z-index: 9999; margin-top: 20px;">
    <div id="toast" class="toast" role="alert">
        <div class="toast-header">
            <strong class="me-auto" id="toast-title">提示</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toast-message"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script>
    let statementCurrentPage = 1;
    let statementPageSize = 10;
    let generateModalInstance = null;
    let objectionModalInstance = null;

    document.addEventListener('DOMContentLoaded', function() {
        generateModalInstance = new bootstrap.Modal(document.getElementById('generateModal'));
        objectionModalInstance = new bootstrap.Modal(document.getElementById('objectionModal'));
        loadStatementList();
    });

    function loadStatementList() {
        const startDate = document.getElementById('search-statement-startDate').value;
        const endDate = document.getElementById('search-statement-endDate').value;
        const agentName = document.getElementById('search-statement-agentName').value;
        const status = document.getElementById('search-statement-status').value;

        let url = `/statement/api/list?pageNum=${statementCurrentPage}&pageSize=${statementPageSize}`;
        if (startDate) url += `&startDate=${encodeURIComponent(startDate)}`;
        if (endDate) url += `&endDate=${encodeURIComponent(endDate)}`;
        if (agentName) url += `&agentName=${encodeURIComponent(agentName)}`;
        if (status) url += `&status=${status}`;

        fetch(url)
            .then(response => response.json())
            .then(result => {
                if (result.code === 200) {
                    renderStatementTable(result.data);
                    renderStatementPagination(result.total);
                    document.getElementById('statement-total').textContent = result.total || 0;
                } else {
                    showToast('加载失败: ' + (result.msg || '未知错误'), 'error');
                }
            })
            .catch(error => {
                console.error('加载对账单列表失败:', error);
                showToast('加载失败', 'error');
            });
    }

    function renderStatementTable(data) {
        const tbody = document.getElementById('statement-table');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-3">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(statement => {
            let statusBadge = '';
            let actionBtns = '';
            if (statement.status === 1) {
                statusBadge = '<span class="badge bg-success">已确认</span>';
                actionBtns = `<button class="btn btn-sm btn-outline-info" onclick="exportStatementDetail(${statement.id})">
                    <i class="bi bi-download"></i> 下载
                   </button>`;
            } else if (statement.status === 2) {
                statusBadge = '<span class="badge bg-danger">有异议</span>';
                actionBtns = `<button class="btn btn-sm btn-outline-info" onclick="exportStatementDetail(${statement.id})">
                    <i class="bi bi-download"></i> 下载
                   </button>`;
            } else {
                statusBadge = '<span class="badge bg-warning">待确认</span>';
                actionBtns = `<button class="btn btn-sm btn-outline-success" onclick="confirmStatement(${statement.id})">
                    <i class="bi bi-check-circle"></i> 确认
                   </button>
                   <button class="btn btn-sm btn-outline-danger ms-1" onclick="openObjectionModal(${statement.id})">
                    <i class="bi bi-exclamation-circle"></i> 异议
                   </button>
                   <button class="btn btn-sm btn-outline-info ms-1" onclick="exportStatementDetail(${statement.id})">
                    <i class="bi bi-download"></i> 下载
                   </button>`;
            }
            return `
                <tr>
                    <td>${escapeHtml(statement.statementNo || '-')}</td>
                    <td>${escapeHtml(statement.agentName || statement.agentNo || '-')}</td>
                    <td>${statement.statDate || '-'}</td>
                    <td>¥${statement.totalTransAmount || '0.00'}</td>
                    <td>${statement.totalTransCount || 0}</td>
                    <td>¥${statement.totalFeeAmount || '0.00'}</td>
                    <td><span class="text-success">¥${statement.totalProfitAmount || '0.00'}</span></td>
                    <td>${statusBadge}</td>
                    <td>${statement.confirmTime ? formatDateTime(statement.confirmTime) : '-'}</td>
                    <td>${actionBtns}</td>
                </tr>
            `;
        }).join('');
    }

    function renderStatementPagination(total) {
        const totalPages = Math.ceil(total / statementPageSize);
        const pagination = document.getElementById('statement-pagination');

        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = '<ul class="pagination pagination-sm mb-0">';

        html += `<li class="page-item ${statementCurrentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="goToStatementPage(${statementCurrentPage - 1})">上一页</a>
        </li>`;

        for (let i = 1; i <= totalPages && i <= 10; i++) {
            html += `<li class="page-item ${i === statementCurrentPage ? 'active' : ''}">
                <a class="page-link" href="javascript:void(0)" onclick="goToStatementPage(${i})">${i}</a>
            </li>`;
        }

        html += `<li class="page-item ${statementCurrentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="goToStatementPage(${statementCurrentPage + 1})">下一页</a>
        </li>`;

        html += '</ul>';
        pagination.innerHTML = html;
    }

    function goToStatementPage(page) {
        statementCurrentPage = page;
        loadStatementList();
    }

    function searchStatement() {
        statementCurrentPage = 1;
        loadStatementList();
    }

    function resetStatementSearch() {
        document.getElementById('search-statement-startDate').value = '';
        document.getElementById('search-statement-endDate').value = '';
        document.getElementById('search-statement-agentName').value = '';
        document.getElementById('search-statement-status').value = '';
        searchStatement();
    }

    function openGenerateModal() {
        document.getElementById('gen-startDate').value = '';
        document.getElementById('gen-endDate').value = '';
        document.getElementById('gen-agentName').value = '';
        generateModalInstance.show();
    }

    function generateStatement() {
        const startDate = document.getElementById('gen-startDate').value;
        const endDate = document.getElementById('gen-endDate').value;
        const agentName = document.getElementById('gen-agentName').value;

        if (!startDate || !endDate) {
            showToast('请选择开始日期和结束日期', 'error');
            return;
        }

        let url = `/statement/api/generate?startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}`;
        if (agentName) {
            url += `&agentName=${encodeURIComponent(agentName)}`;
        }

        fetch(url, {
            method: 'POST'
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 200) {
                showToast('对账单生成成功', 'success');
                generateModalInstance.hide();
                loadStatementList();
            } else {
                showToast(result.msg || '生成失败', 'error');
            }
        })
        .catch(error => {
            console.error('生成对账单失败:', error);
            showToast('生成失败', 'error');
        });
    }

    function confirmStatement(id) {
        if (!confirm('确定要确认该对账单吗？')) {
            return;
        }

        fetch(`/statement/api/confirm/${id}`, {
            method: 'POST'
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 200) {
                showToast('确认成功', 'success');
                loadStatementList();
            } else {
                showToast(result.msg || '确认失败', 'error');
            }
        })
        .catch(error => {
            console.error('确认失败:', error);
            showToast('确认失败', 'error');
        });
    }

    function openObjectionModal(id) {
        document.getElementById('obj-statement-id').value = id;
        document.getElementById('obj-remark').value = '';
        objectionModalInstance.show();
    }

    function submitObjection() {
        const id = document.getElementById('obj-statement-id').value;
        const remark = document.getElementById('obj-remark').value.trim();

        if (!remark) {
            showToast('请输入异议说明', 'error');
            return;
        }

        fetch(`/statement/api/objection/${id}?remark=${encodeURIComponent(remark)}`, {
            method: 'POST'
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 200) {
                showToast('异议已提交', 'success');
                objectionModalInstance.hide();
                loadStatementList();
            } else {
                showToast(result.msg || '提交失败', 'error');
            }
        })
        .catch(error => {
            console.error('提交失败:', error);
            showToast('提交失败', 'error');
        });
    }

    function exportStatement() {
        const startDate = document.getElementById('search-statement-startDate').value;
        const endDate = document.getElementById('search-statement-endDate').value;
        const agentName = document.getElementById('search-statement-agentName').value;
        const status = document.getElementById('search-statement-status').value;

        let url = '/statement/api/export?';
        if (startDate) url += `startDate=${encodeURIComponent(startDate)}&`;
        if (endDate) url += `endDate=${encodeURIComponent(endDate)}&`;
        if (agentName) url += `agentName=${encodeURIComponent(agentName)}&`;
        if (status) url += `status=${status}&`;

        window.location.href = url;
    }

    function exportStatementDetail(id) {
        window.location.href = `/statement/api/export-detail/${id}`;
    }
</script>
</body>
</html>
