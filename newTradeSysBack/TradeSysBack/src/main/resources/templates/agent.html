<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - 后台管理系统' : '后台管理系统'}">后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
</head>
<body>
<div id="wrapper">
    <div id="sidebar-wrapper">
        <div class="sidebar-brand">
            <a href="/">
                <i class="bi bi-gear-wide-connected"></i>
                后台管理系统
            </a>
        </div>
        <div class="sidebar-menu">
            <a href="/" class="menu-item">
                <i class="bi bi-house-door"></i>
                首页
            </a>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-gear"></i>
                系统管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/system/user" class="menu-item">
                    <i class="bi bi-person-circle"></i>
                    系统用户管理
                </a>
                <a href="/system/role" class="menu-item">
                    <i class="bi bi-people-fill"></i>
                    角色管理
                </a>
                <a href="/system/permission" class="menu-item">
                    <i class="bi bi-key-fill"></i>
                    权限管理
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item active" onclick="toggleMenu(this)">
                <i class="bi bi-person-badge"></i>
                用户管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu open">
                <a href="/agent" class="menu-item active">
                    <i class="bi bi-building"></i>
                    代理商管理
                </a>
                <a href="/merchant" class="menu-item">
                    <i class="bi bi-shop"></i>
                    商户管理
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-box-seam"></i>
                产品管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/product" class="menu-item">
                    <i class="bi bi-box"></i>
                    产品信息
                </a>
                <a href="/machine" class="menu-item">
                    <i class="bi bi-hdd"></i>
                    机器信息
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-wallet2"></i>
                账户管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/agent-account" class="menu-item">
                    <i class="bi bi-credit-card"></i>
                    代理账户
                </a>
                <a href="/profit" class="menu-item">
                    <i class="bi bi-cash-stack"></i>
                    分润信息
                </a>
                <a href="/account-detail" class="menu-item">
                    <i class="bi bi-list-ul"></i>
                    账户明细
                </a>
                <a href="/statement" class="menu-item">
                    <i class="bi bi-file-earmark-text"></i>
                    对账单
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-shuffle"></i>
                交易管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/channel" class="menu-item">
                    <i class="bi bi-link-45deg"></i>
                    通道管理
                </a>
                <a href="/transaction" class="menu-item">
                    <i class="bi bi-bar-chart-line"></i>
                    交易明细
                </a>
            </div>
        </div>
    </div>

    <div id="content-wrapper">
        <nav class="topbar">
            <div class="topbar-title" th:text="${pageTitle != null ? pageTitle : '代理商管理'}">代理商管理</div>
            <div class="topbar-user">
                <div class="dropdown">
                    <div class="user-info" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="avatar" th:text="${currentUser != null ? (currentUser.realName != null ? #strings.substring(currentUser.realName, 0, 1) : #strings.substring(currentUser.username, 0, 1)) : '管'}">管</div>
                        <div>
                            <div class="user-name" th:text="${currentUser != null ? (currentUser.realName != null ? currentUser.realName : currentUser.username) : '管理员'}">管理员</div>
                            <div class="user-role" th:text="${currentRole != null ? currentRole : '系统管理员'}">系统管理员</div>
                        </div>
                        <i class="bi bi-chevron-down"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="javascript:void(0)">
                            <i class="bi bi-person-circle"></i> 个人信息
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" style="display: inline;">
                                <button type="submit" class="dropdown-item text-danger" style="border: none; background: none; cursor: pointer; width: 100%; text-align: left;">
                                    <i class="bi bi-box-arrow-right"></i> 退出登录
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div id="page-content">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item">用户管理</li>
                    <li class="breadcrumb-item active">代理商管理</li>
                </ol>
            </nav>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <div class="d-flex flex-wrap gap-3">
                                <div>
                                    <label class="form-label small text-muted mb-1">代理商名称</label>
                                    <input type="text" class="form-control form-control-sm" id="search-agentName" placeholder="请输入代理商名称">
                                </div>
                                <div>
                                    <label class="form-label small text-muted mb-1">状态</label>
                                    <select class="form-select form-select-sm" id="search-agentStatus">
                                        <option value="">全部</option>
                                        <option value="1">启用</option>
                                        <option value="0">禁用</option>
                                    </select>
                                </div>
                                <div class="align-self-end">
                                    <button class="btn btn-primary btn-sm" onclick="searchAgent()">
                                        <i class="bi bi-search"></i> 查询
                                    </button>
                                    <button class="btn btn-secondary btn-sm ms-2" onclick="resetAgentSearch()">
                                        <i class="bi bi-arrow-repeat"></i> 重置
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-primary btn-sm" onclick="openAgentModal()">
                                <i class="bi bi-plus"></i> 新增代理商
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>代理商编号</th>
                                    <th>代理商名称</th>
                                    <th>上级代理</th>
                                    <th>联系人</th>
                                    <th>手机号</th>
                                    <th>直属商户</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="agent-table">
                                <tr>
                                    <td colspan="9" class="text-center py-3">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <span class="small text-muted">共 <span id="agent-total">0</span> 条记录</span>
                        </div>
                        <div class="col-auto">
                            <nav id="agent-pagination"></nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="agentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="agentModalTitle">新增代理商</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="agentForm">
                    <input type="hidden" id="agent-id">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">代理商名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="agent-agentName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">上级代理</label>
                            <select class="form-select" id="agent-parentId">
                                <option value="">无(顶级代理)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">联系人</label>
                            <input type="text" class="form-control" id="agent-contactName">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">手机号</label>
                            <input type="text" class="form-control" id="agent-phone">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-control" id="agent-email">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">状态</label>
                            <select class="form-select" id="agent-status">
                                <option value="1">启用</option>
                                <option value="0">禁用</option>
                            </select>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">地址</label>
                            <input type="text" class="form-control" id="agent-address">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">身份证号</label>
                            <input type="text" class="form-control" id="agent-idCard">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">开户行</label>
                            <input type="text" class="form-control" id="agent-bankName">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">银行账号</label>
                            <input type="text" class="form-control" id="agent-bankAccount">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveAgent()">保存</button>
            </div>
        </div>
    </div>
</div>

<div id="loading" class="loading">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div class="toast-container position-fixed top-0 start-50 translate-middle-x" style="z-index: 9999; margin-top: 20px;">
    <div id="toast" class="toast" role="alert">
        <div class="toast-header">
            <strong class="me-auto" id="toast-title">提示</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toast-message"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script>
    let agentCurrentPage = 1;
    let agentPageSize = 10;
    let agentModalInstance = null;

    document.addEventListener('DOMContentLoaded', function() {
        agentModalInstance = new bootstrap.Modal(document.getElementById('agentModal'));
        loadAgentList();
        loadParentAgents();
    });

    function loadAgentList() {
        const agentName = document.getElementById('search-agentName').value;
        const status = document.getElementById('search-agentStatus').value;

        let url = `/agent/api/list?pageNum=${agentCurrentPage}&pageSize=${agentPageSize}`;
        if (agentName) url += `&agentName=${encodeURIComponent(agentName)}`;
        if (status) url += `&status=${status}`;

        fetch(url)
            .then(response => response.json())
            .then(result => {
                if (result.code === 200) {
                    renderAgentTable(result.data);
                    renderAgentPagination(result.total);
                    document.getElementById('agent-total').textContent = result.total || 0;
                } else {
                    showToast('加载失败: ' + (result.msg || '未知错误'), 'error');
                }
            })
            .catch(error => {
                console.error('加载代理商列表失败:', error);
                showToast('加载失败', 'error');
            });
    }

    function renderAgentTable(data) {
        const tbody = document.getElementById('agent-table');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-3">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(agent => {
            return `
                <tr>
                    <td>${agent.id || '-'}</td>
                    <td>${escapeHtml(agent.agentNo || '-')}</td>
                    <td>${escapeHtml(agent.agentName)}</td>
                    <td>${escapeHtml(agent.parentName || '-')}</td>
                    <td>${escapeHtml(agent.contactName || '-')}</td>
                    <td>${escapeHtml(agent.phone || '-')}</td>
                    <td>${agent.directMerchantCount || 0}</td>
                    <td>${getStatusBadge(agent.status)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editAgent(${agent.id})">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteAgent(${agent.id})">
                            <i class="bi bi-trash"></i> 删除
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function renderAgentPagination(total) {
        const totalPages = Math.ceil(total / agentPageSize);
        const pagination = document.getElementById('agent-pagination');

        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = '<ul class="pagination pagination-sm mb-0">';

        html += `<li class="page-item ${agentCurrentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="goToAgentPage(${agentCurrentPage - 1})">上一页</a>
        </li>`;

        for (let i = 1; i <= totalPages && i <= 10; i++) {
            html += `<li class="page-item ${i === agentCurrentPage ? 'active' : ''}">
                <a class="page-link" href="javascript:void(0)" onclick="goToAgentPage(${i})">${i}</a>
            </li>`;
        }

        html += `<li class="page-item ${agentCurrentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="goToAgentPage(${agentCurrentPage + 1})">下一页</a>
        </li>`;

        html += '</ul>';
        pagination.innerHTML = html;
    }

    function goToAgentPage(page) {
        agentCurrentPage = page;
        loadAgentList();
    }

    function searchAgent() {
        agentCurrentPage = 1;
        loadAgentList();
    }

    function resetAgentSearch() {
        document.getElementById('search-agentName').value = '';
        document.getElementById('search-agentStatus').value = '';
        searchAgent();
    }

    function loadParentAgents() {
        fetch('/agent/api/options')
            .then(response => response.json())
            .then(result => {
                if (result.code === 200 && result.data) {
                    const select = document.getElementById('agent-parentId');
                    const currentId = document.getElementById('agent-id').value;
                    let html = '<option value="">无(顶级代理)</option>';
                    result.data.forEach(agent => {
                        if (currentId && agent.id == currentId) return;
                        html += `<option value="${agent.id}">${agent.agentName}</option>`;
                    });
                    select.innerHTML = html;
                }
            });
    }

    function openAgentModal() {
        document.getElementById('agentModalTitle').textContent = '新增代理商';
        document.getElementById('agentForm').reset();
        document.getElementById('agent-id').value = '';
        document.getElementById('agent-status').value = '1';
        loadParentAgents();
        agentModalInstance.show();
    }

    function editAgent(id) {
        fetch(`/agent/api/${id}`)
            .then(response => response.json())
            .then(result => {
                if (result.code === 200 && result.data) {
                    const agent = result.data;
                    document.getElementById('agentModalTitle').textContent = '编辑代理商';
                    document.getElementById('agent-id').value = agent.id;
                    document.getElementById('agent-agentName').value = agent.agentName || '';
                    document.getElementById('agent-contactName').value = agent.contactName || '';
                    document.getElementById('agent-phone').value = agent.phone || '';
                    document.getElementById('agent-email').value = agent.email || '';
                    document.getElementById('agent-address').value = agent.address || '';
                    document.getElementById('agent-idCard').value = agent.idCard || '';
                    document.getElementById('agent-bankName').value = agent.bankName || '';
                    document.getElementById('agent-bankAccount').value = agent.bankAccount || '';
                    document.getElementById('agent-status').value = agent.status !== null ? agent.status : '1';

                    loadParentAgents();
                    if (agent.parentId) {
                        setTimeout(() => {
                            document.getElementById('agent-parentId').value = agent.parentId;
                        }, 200);
                    }

                    agentModalInstance.show();
                } else {
                    showToast('获取代理商信息失败', 'error');
                }
            })
            .catch(error => {
                console.error('获取代理商信息失败:', error);
                showToast('获取代理商信息失败', 'error');
            });
    }

    function saveAgent() {
        const id = document.getElementById('agent-id').value;
        const agentName = document.getElementById('agent-agentName').value.trim();
        const parentIdValue = document.getElementById('agent-parentId').value;
        const parentId = parentIdValue ? parseInt(parentIdValue) : null;
        const contactName = document.getElementById('agent-contactName').value.trim();
        const phone = document.getElementById('agent-phone').value.trim();
        const email = document.getElementById('agent-email').value.trim();
        const address = document.getElementById('agent-address').value.trim();
        const idCard = document.getElementById('agent-idCard').value.trim();
        const bankName = document.getElementById('agent-bankName').value.trim();
        const bankAccount = document.getElementById('agent-bankAccount').value.trim();
        const status = parseInt(document.getElementById('agent-status').value);

        if (!agentName) {
            showToast('请输入代理商名称', 'error');
            return;
        }

        const data = {
            agentName: agentName,
            contactName: contactName,
            phone: phone,
            email: email,
            address: address,
            idCard: idCard,
            bankName: bankName,
            bankAccount: bankAccount,
            status: status
        };

        if (parentId !== null) {
            data.parentId = parentId;
        }

        let url = '/agent/api/add';
        if (id) {
            url = '/agent/api/update';
            data.id = parseInt(id);
        }

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 200) {
                showToast(id ? '更新成功' : '添加成功', 'success');
                agentModalInstance.hide();
                loadAgentList();
            } else {
                showToast(result.msg || '操作失败', 'error');
            }
        })
        .catch(error => {
            console.error('保存代理商失败:', error);
            showToast('保存失败', 'error');
        });
    }

    function deleteAgent(id) {
        if (!confirm('确定要删除该代理商吗？')) {
            return;
        }

        fetch(`/agent/api/delete/${id}`, {
            method: 'POST'
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 200) {
                showToast('删除成功', 'success');
                loadAgentList();
            } else {
                showToast(result.msg || '删除失败', 'error');
            }
        })
        .catch(error => {
            console.error('删除代理商失败:', error);
            showToast('删除失败', 'error');
        });
    }
</script>
</body>
</html>
