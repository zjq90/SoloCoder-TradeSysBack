<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - 后台管理系统' : '后台管理系统'}">后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
</head>
<body>
<div id="wrapper">
    <div id="sidebar-wrapper">
        <div class="sidebar-brand">
            <a href="/">
                <i class="bi bi-gear-wide-connected"></i>
                后台管理系统
            </a>
        </div>
        <div class="sidebar-menu">
            <a href="/" class="menu-item">
                <i class="bi bi-house-door"></i>
                首页
            </a>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-gear"></i>
                系统管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/system/user" class="menu-item">
                    <i class="bi bi-person-circle"></i>
                    系统用户管理
                </a>
                <a href="/system/role" class="menu-item">
                    <i class="bi bi-people-fill"></i>
                    角色管理
                </a>
                <a href="/system/permission" class="menu-item">
                    <i class="bi bi-key-fill"></i>
                    权限管理
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-person-badge"></i>
                用户管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/agent" class="menu-item">
                    <i class="bi bi-building"></i>
                    代理商管理
                </a>
                <a href="/merchant" class="menu-item">
                    <i class="bi bi-shop"></i>
                    商户管理
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-box-seam"></i>
                产品管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/product" class="menu-item">
                    <i class="bi bi-cube"></i>
                    产品信息
                </a>
                <a href="/machine" class="menu-item">
                    <i class="bi bi-hdd"></i>
                    机器信息
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-wallet2"></i>
                账户管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/agent-account" class="menu-item">
                    <i class="bi bi-credit-card"></i>
                    代理账户
                </a>
                <a href="/profit" class="menu-item">
                    <i class="bi bi-cash-stack"></i>
                    分润信息
                </a>
                <a href="/account-detail" class="menu-item">
                    <i class="bi bi-list-ul"></i>
                    账户明细
                </a>
                <a href="/statement" class="menu-item">
                    <i class="bi bi-file-earmark-text"></i>
                    对账单
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item active" onclick="toggleMenu(this)">
                <i class="bi bi-exchange"></i>
                交易管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu open">
                <a href="/channel" class="menu-item active">
                    <i class="bi bi-link-45deg"></i>
                    通道管理
                </a>
                <a href="/transaction" class="menu-item">
                    <i class="bi bi-bar-chart-line"></i>
                    交易明细
                </a>
            </div>
        </div>
    </div>

    <div id="content-wrapper">
        <nav class="topbar">
            <div class="topbar-title" th:text="${pageTitle != null ? pageTitle : '通道管理'}">通道管理</div>
            <div class="topbar-user">
                <div class="dropdown">
                    <div class="user-info" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="avatar" th:text="${currentUser != null ? (currentUser.realName != null ? #strings.substring(currentUser.realName, 0, 1) : #strings.substring(currentUser.username, 0, 1)) : '管'}">管</div>
                        <div>
                            <div class="user-name" th:text="${currentUser != null ? (currentUser.realName != null ? currentUser.realName : currentUser.username) : '管理员'}">管理员</div>
                            <div class="user-role" th:text="${currentRole != null ? currentRole : '系统管理员'}">系统管理员</div>
                        </div>
                        <i class="bi bi-chevron-down"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="javascript:void(0)">
                            <i class="bi bi-person-circle"></i> 个人信息
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" style="display: inline;">
                                <button type="submit" class="dropdown-item text-danger" style="border: none; background: none; cursor: pointer; width: 100%; text-align: left;">
                                    <i class="bi bi-box-arrow-right"></i> 退出登录
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div id="page-content">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item">交易管理</li>
                    <li class="breadcrumb-item active">通道管理</li>
                </ol>
            </nav>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <div class="d-flex flex-wrap gap-3">
                                <div>
                                    <label class="form-label small text-muted mb-1">通道名称</label>
                                    <input type="text" class="form-control form-control-sm" id="search-channelName" placeholder="请输入通道名称">
                                </div>
                                <div>
                                    <label class="form-label small text-muted mb-1">状态</label>
                                    <select class="form-select form-select-sm" id="search-channelStatus">
                                        <option value="">全部</option>
                                        <option value="1">启用</option>
                                        <option value="0">禁用</option>
                                    </select>
                                </div>
                                <div class="align-self-end">
                                    <button class="btn btn-primary btn-sm" onclick="searchChannel()">
                                        <i class="bi bi-search"></i> 查询
                                    </button>
                                    <button class="btn btn-secondary btn-sm ms-2" onclick="resetChannelSearch()">
                                        <i class="bi bi-arrow-repeat"></i> 重置
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-primary btn-sm" onclick="openChannelModal()">
                                <i class="bi bi-plus"></i> 新增通道
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>通道编号</th>
                                    <th>通道名称</th>
                                    <th>类型</th>
                                    <th>服务商</th>
                                    <th>费率</th>
                                    <th>今日交易额</th>
                                    <th>今日笔数</th>
                                    <th>剩余额度</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="channel-table">
                                <tr>
                                    <td colspan="11" class="text-center py-3">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <span class="small text-muted">共 <span id="channel-total">0</span> 条记录</span>
                        </div>
                        <div class="col-auto">
                            <nav id="channel-pagination"></nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="channelModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="channelModalTitle">新增通道</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="channelForm">
                    <input type="hidden" id="channel-id">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">通道名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="channel-channelName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">通道类型</label>
                            <select class="form-select" id="channel-channelType">
                                <option value="1">微信支付</option>
                                <option value="2">支付宝</option>
                                <option value="3">银联</option>
                                <option value="4">其他</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">服务商</label>
                            <input type="text" class="form-control" id="channel-provider">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">费率</label>
                            <input type="number" class="form-control" id="channel-rate" step="0.0001" placeholder="0.0000">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">单日限额</label>
                            <input type="number" class="form-control" id="channel-dailyLimit" step="0.01" placeholder="0.00">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">单笔限额</label>
                            <input type="number" class="form-control" id="channel-singleLimit" step="0.01" placeholder="0.00">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">商户限额</label>
                            <input type="number" class="form-control" id="channel-merchantLimit" step="0.01" placeholder="0.00">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">状态</label>
                            <select class="form-select" id="channel-status">
                                <option value="1">启用</option>
                                <option value="0">禁用</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveChannel()">保存</button>
            </div>
        </div>
    </div>
</div>

<div id="loading" class="loading">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div class="toast-container">
    <div id="toast" class="toast" role="alert">
        <div class="toast-header">
            <strong class="me-auto" id="toast-title">提示</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toast-message"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script>
    let channelCurrentPage = 1;
    let channelPageSize = 10;
    let channelModalInstance = null;

    document.addEventListener('DOMContentLoaded', function() {
        channelModalInstance = new bootstrap.Modal(document.getElementById('channelModal'));
        loadChannelList();
    });

    function loadChannelList() {
        const channelName = document.getElementById('search-channelName').value;
        const status = document.getElementById('search-channelStatus').value;

        let url = `/api/channel/list?pageNum=${channelCurrentPage}&pageSize=${channelPageSize}`;
        if (channelName) url += `&channelName=${encodeURIComponent(channelName)}`;
        if (status) url += `&status=${status}`;

        fetch(url)
            .then(response => response.json())
            .then(result => {
                if (result.code === 200) {
                    renderChannelTable(result.data);
                    renderChannelPagination(result.total);
                    document.getElementById('channel-total').textContent = result.total || 0;
                } else {
                    showToast('加载失败: ' + (result.msg || '未知错误'), 'error');
                }
            })
            .catch(error => {
                console.error('加载通道列表失败:', error);
                showToast('加载失败', 'error');
            });
    }

    function renderChannelTable(data) {
        const tbody = document.getElementById('channel-table');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11" class="text-center py-3">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(channel => {
            const channelTypeText = channel.channelType === 1 ? '微信支付' 
                : channel.channelType === 2 ? '支付宝' 
                : channel.channelType === 3 ? '银联' : '其他';
            return `
                <tr>
                    <td>${channel.id || '-'}</td>
                    <td>${escapeHtml(channel.channelNo || '-')}</td>
                    <td>${escapeHtml(channel.channelName)}</td>
                    <td>${channelTypeText}</td>
                    <td>${escapeHtml(channel.provider || '-')}</td>
                    <td>${channel.rate || '0.00%'}</td>
                    <td><span class="text-primary">¥${channel.todayAmount || '0.00'}</span></td>
                    <td>${channel.todayCount || 0}</td>
                    <td><span class="text-success">¥${channel.remainingAmount || '0.00'}</span></td>
                    <td>${getStatusBadge(channel.status)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editChannel(${channel.id})">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteChannel(${channel.id})">
                            <i class="bi bi-trash"></i> 删除
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function renderChannelPagination(total) {
        const totalPages = Math.ceil(total / channelPageSize);
        const pagination = document.getElementById('channel-pagination');

        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = '<ul class="pagination pagination-sm mb-0">';

        html += `<li class="page-item ${channelCurrentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="goToChannelPage(${channelCurrentPage - 1})">上一页</a>
        </li>`;

        for (let i = 1; i <= totalPages && i <= 10; i++) {
            html += `<li class="page-item ${i === channelCurrentPage ? 'active' : ''}">
                <a class="page-link" href="javascript:void(0)" onclick="goToChannelPage(${i})">${i}</a>
            </li>`;
        }

        html += `<li class="page-item ${channelCurrentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="goToChannelPage(${channelCurrentPage + 1})">下一页</a>
        </li>`;

        html += '</ul>';
        pagination.innerHTML = html;
    }

    function goToChannelPage(page) {
        channelCurrentPage = page;
        loadChannelList();
    }

    function searchChannel() {
        channelCurrentPage = 1;
        loadChannelList();
    }

    function resetChannelSearch() {
        document.getElementById('search-channelName').value = '';
        document.getElementById('search-channelStatus').value = '';
        searchChannel();
    }

    function openChannelModal() {
        document.getElementById('channelModalTitle').textContent = '新增通道';
        document.getElementById('channelForm').reset();
        document.getElementById('channel-id').value = '';
        document.getElementById('channel-status').value = '1';
        channelModalInstance.show();
    }

    function editChannel(id) {
        fetch(`/api/channel/${id}`)
            .then(response => response.json())
            .then(result => {
                if (result.code === 200 && result.data) {
                    const channel = result.data;
                    document.getElementById('channelModalTitle').textContent = '编辑通道';
                    document.getElementById('channel-id').value = channel.id;
                    document.getElementById('channel-channelName').value = channel.channelName || '';
                    document.getElementById('channel-channelType').value = channel.channelType || '1';
                    document.getElementById('channel-provider').value = channel.provider || '';
                    document.getElementById('channel-rate').value = channel.rate || '';
                    document.getElementById('channel-dailyLimit').value = channel.dailyLimit || '';
                    document.getElementById('channel-singleLimit').value = channel.singleLimit || '';
                    document.getElementById('channel-merchantLimit').value = channel.merchantLimit || '';
                    document.getElementById('channel-status').value = channel.status !== null ? channel.status : '1';

                    channelModalInstance.show();
                } else {
                    showToast('获取通道信息失败', 'error');
                }
            })
            .catch(error => {
                console.error('获取通道信息失败:', error);
                showToast('获取通道信息失败', 'error');
            });
    }

    function saveChannel() {
        const id = document.getElementById('channel-id').value;
        const channelName = document.getElementById('channel-channelName').value.trim();

        if (!channelName) {
            showToast('请输入通道名称', 'error');
            return;
        }

        const data = {
            channelName: channelName,
            channelType: parseInt(document.getElementById('channel-channelType').value),
            provider: document.getElementById('channel-provider').value.trim(),
            status: parseInt(document.getElementById('channel-status').value)
        };

        const rate = document.getElementById('channel-rate').value;
        const dailyLimit = document.getElementById('channel-dailyLimit').value;
        const singleLimit = document.getElementById('channel-singleLimit').value;
        const merchantLimit = document.getElementById('channel-merchantLimit').value;

        if (rate) data.rate = parseFloat(rate);
        if (dailyLimit) data.dailyLimit = parseFloat(dailyLimit);
        if (singleLimit) data.singleLimit = parseFloat(singleLimit);
        if (merchantLimit) data.merchantLimit = parseFloat(merchantLimit);

        let url = '/api/channel/add';
        if (id) {
            url = '/api/channel/update';
            data.id = parseInt(id);
        }

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 200) {
                showToast(id ? '更新成功' : '添加成功', 'success');
                channelModalInstance.hide();
                loadChannelList();
            } else {
                showToast(result.msg || '操作失败', 'error');
            }
        })
        .catch(error => {
            console.error('保存通道失败:', error);
            showToast('保存失败', 'error');
        });
    }

    function deleteChannel(id) {
        if (!confirm('确定要删除该通道吗？')) {
            return;
        }

        fetch(`/api/channel/delete/${id}`, {
            method: 'POST'
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 200) {
                showToast('删除成功', 'success');
                loadChannelList();
            } else {
                showToast(result.msg || '删除失败', 'error');
            }
        })
        .catch(error => {
            console.error('删除通道失败:', error);
            showToast('删除失败', 'error');
        });
    }
</script>
</body>
</html>
