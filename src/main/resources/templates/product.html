<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - 后台管理系统' : '后台管理系统'}">后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
</head>
<body>
<div id="wrapper">
    <div id="sidebar-wrapper">
        <div class="sidebar-brand">
            <a href="/">
                <i class="bi bi-gear-wide-connected"></i>
                后台管理系统
            </a>
        </div>
        <div class="sidebar-menu">
            <a href="/" class="menu-item">
                <i class="bi bi-house-door"></i>
                首页
            </a>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-gear"></i>
                系统管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/system/user" class="menu-item">
                    <i class="bi bi-person-circle"></i>
                    系统用户管理
                </a>
                <a href="/system/role" class="menu-item">
                    <i class="bi bi-people-fill"></i>
                    角色管理
                </a>
                <a href="/system/permission" class="menu-item">
                    <i class="bi bi-key-fill"></i>
                    权限管理
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-person-badge"></i>
                用户管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/agent" class="menu-item">
                    <i class="bi bi-building"></i>
                    代理商管理
                </a>
                <a href="/merchant" class="menu-item">
                    <i class="bi bi-shop"></i>
                    商户管理
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item active" onclick="toggleMenu(this)">
                <i class="bi bi-box-seam"></i>
                产品管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu open">
                <a href="/product" class="menu-item active">
                    <i class="bi bi-cube"></i>
                    产品信息
                </a>
                <a href="/machine" class="menu-item">
                    <i class="bi bi-hdd"></i>
                    机器信息
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-wallet2"></i>
                账户管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/agent-account" class="menu-item">
                    <i class="bi bi-credit-card"></i>
                    代理账户
                </a>
                <a href="/profit" class="menu-item">
                    <i class="bi bi-cash-stack"></i>
                    分润信息
                </a>
                <a href="/account-detail" class="menu-item">
                    <i class="bi bi-list-ul"></i>
                    账户明细
                </a>
                <a href="/statement" class="menu-item">
                    <i class="bi bi-file-earmark-text"></i>
                    对账单
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-exchange"></i>
                交易管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/channel" class="menu-item">
                    <i class="bi bi-link-45deg"></i>
                    通道管理
                </a>
                <a href="/transaction" class="menu-item">
                    <i class="bi bi-bar-chart-line"></i>
                    交易明细
                </a>
            </div>
        </div>
    </div>

    <div id="content-wrapper">
        <nav class="topbar">
            <div class="topbar-title" th:text="${pageTitle != null ? pageTitle : '产品信息'}">产品信息</div>
            <div class="topbar-user">
                <div class="dropdown">
                    <div class="user-info" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="avatar" th:text="${currentUser != null ? (currentUser.realName != null ? #strings.substring(currentUser.realName, 0, 1) : #strings.substring(currentUser.username, 0, 1)) : '管'}">管</div>
                        <div>
                            <div class="user-name" th:text="${currentUser != null ? (currentUser.realName != null ? currentUser.realName : currentUser.username) : '管理员'}">管理员</div>
                            <div class="user-role" th:text="${currentRole != null ? currentRole : '系统管理员'}">系统管理员</div>
                        </div>
                        <i class="bi bi-chevron-down"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="javascript:void(0)">
                            <i class="bi bi-person-circle"></i> 个人信息
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" style="display: inline;">
                                <button type="submit" class="dropdown-item text-danger" style="border: none; background: none; cursor: pointer; width: 100%; text-align: left;">
                                    <i class="bi bi-box-arrow-right"></i> 退出登录
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div id="page-content">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item">产品管理</li>
                    <li class="breadcrumb-item active">产品信息</li>
                </ol>
            </nav>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <div class="d-flex flex-wrap gap-3">
                                <div>
                                    <label class="form-label small text-muted mb-1">产品名称</label>
                                    <input type="text" class="form-control form-control-sm" id="search-productName" placeholder="请输入产品名称">
                                </div>
                                <div>
                                    <label class="form-label small text-muted mb-1">状态</label>
                                    <select class="form-select form-select-sm" id="search-productStatus">
                                        <option value="">全部</option>
                                        <option value="1">启用</option>
                                        <option value="0">禁用</option>
                                    </select>
                                </div>
                                <div class="align-self-end">
                                    <button class="btn btn-primary btn-sm" onclick="searchProduct()">
                                        <i class="bi bi-search"></i> 查询
                                    </button>
                                    <button class="btn btn-secondary btn-sm ms-2" onclick="resetProductSearch()">
                                        <i class="bi bi-arrow-repeat"></i> 重置
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-primary btn-sm" onclick="openProductModal()">
                                <i class="bi bi-plus"></i> 新增产品
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>产品编号</th>
                                    <th>产品名称</th>
                                    <th>类型</th>
                                    <th>单价</th>
                                    <th>成本价</th>
                                    <th>默认费率</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="product-table">
                                <tr>
                                    <td colspan="10" class="text-center py-3">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <span class="small text-muted">共 <span id="product-total">0</span> 条记录</span>
                        </div>
                        <div class="col-auto">
                            <nav id="product-pagination"></nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="productModalTitle">新增产品</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="product-id">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">产品名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="product-productName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">产品类型</label>
                            <select class="form-select" id="product-productType">
                                <option value="1">POS机</option>
                                <option value="2">扫码枪</option>
                                <option value="3">其他</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">单价</label>
                            <input type="number" class="form-control" id="product-unitPrice" step="0.01" placeholder="0.00">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">成本价</label>
                            <input type="number" class="form-control" id="product-costPrice" step="0.01" placeholder="0.00">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">默认费率</label>
                            <input type="number" class="form-control" id="product-defaultRate" step="0.0001" placeholder="0.0000">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">状态</label>
                            <select class="form-select" id="product-status">
                                <option value="1">启用</option>
                                <option value="0">禁用</option>
                            </select>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">描述</label>
                            <textarea class="form-control" id="product-description" rows="2"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveProduct()">保存</button>
            </div>
        </div>
    </div>
</div>

<div id="loading" class="loading">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div class="toast-container">
    <div id="toast" class="toast" role="alert">
        <div class="toast-header">
            <strong class="me-auto" id="toast-title">提示</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toast-message"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script>
    let productCurrentPage = 1;
    let productPageSize = 10;
    let productModalInstance = null;

    document.addEventListener('DOMContentLoaded', function() {
        productModalInstance = new bootstrap.Modal(document.getElementById('productModal'));
        loadProductList();
    });

    function loadProductList() {
        const productName = document.getElementById('search-productName').value;
        const status = document.getElementById('search-productStatus').value;

        let url = `/api/product/list?pageNum=${productCurrentPage}&pageSize=${productPageSize}`;
        if (productName) url += `&productName=${encodeURIComponent(productName)}`;
        if (status) url += `&status=${status}`;

        fetch(url)
            .then(response => response.json())
            .then(result => {
                if (result.code === 200) {
                    renderProductTable(result.data);
                    renderProductPagination(result.total);
                    document.getElementById('product-total').textContent = result.total || 0;
                } else {
                    showToast('加载失败: ' + (result.msg || '未知错误'), 'error');
                }
            })
            .catch(error => {
                console.error('加载产品列表失败:', error);
                showToast('加载失败', 'error');
            });
    }

    function renderProductTable(data) {
        const tbody = document.getElementById('product-table');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" class="text-center py-3">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(product => {
            const productTypeText = product.productType === 1 ? 'POS机' : product.productType === 2 ? '扫码枪' : '其他';
            return `
                <tr>
                    <td>${product.id || '-'}</td>
                    <td>${escapeHtml(product.productNo || '-')}</td>
                    <td>${escapeHtml(product.productName)}</td>
                    <td>${productTypeText}</td>
                    <td>${product.unitPrice || '0.00'}</td>
                    <td>${product.costPrice || '0.00'}</td>
                    <td>${product.defaultRate || '0.00'}</td>
                    <td>${getStatusBadge(product.status)}</td>
                    <td>${product.createTime ? formatDateTime(product.createTime) : '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editProduct(${product.id})">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${product.id})">
                            <i class="bi bi-trash"></i> 删除
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function renderProductPagination(total) {
        const totalPages = Math.ceil(total / productPageSize);
        const pagination = document.getElementById('product-pagination');

        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = '<ul class="pagination pagination-sm mb-0">';

        html += `<li class="page-item ${productCurrentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="goToProductPage(${productCurrentPage - 1})">上一页</a>
        </li>`;

        for (let i = 1; i <= totalPages && i <= 10; i++) {
            html += `<li class="page-item ${i === productCurrentPage ? 'active' : ''}">
                <a class="page-link" href="javascript:void(0)" onclick="goToProductPage(${i})">${i}</a>
            </li>`;
        }

        html += `<li class="page-item ${productCurrentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="goToProductPage(${productCurrentPage + 1})">下一页</a>
        </li>`;

        html += '</ul>';
        pagination.innerHTML = html;
    }

    function goToProductPage(page) {
        productCurrentPage = page;
        loadProductList();
    }

    function searchProduct() {
        productCurrentPage = 1;
        loadProductList();
    }

    function resetProductSearch() {
        document.getElementById('search-productName').value = '';
        document.getElementById('search-productStatus').value = '';
        searchProduct();
    }

    function openProductModal() {
        document.getElementById('productModalTitle').textContent = '新增产品';
        document.getElementById('productForm').reset();
        document.getElementById('product-id').value = '';
        document.getElementById('product-status').value = '1';
        productModalInstance.show();
    }

    function editProduct(id) {
        fetch(`/api/product/${id}`)
            .then(response => response.json())
            .then(result => {
                if (result.code === 200 && result.data) {
                    const product = result.data;
                    document.getElementById('productModalTitle').textContent = '编辑产品';
                    document.getElementById('product-id').value = product.id;
                    document.getElementById('product-productName').value = product.productName || '';
                    document.getElementById('product-productType').value = product.productType || '1';
                    document.getElementById('product-unitPrice').value = product.unitPrice || '';
                    document.getElementById('product-costPrice').value = product.costPrice || '';
                    document.getElementById('product-defaultRate').value = product.defaultRate || '';
                    document.getElementById('product-status').value = product.status !== null ? product.status : '1';
                    document.getElementById('product-description').value = product.description || '';

                    productModalInstance.show();
                } else {
                    showToast('获取产品信息失败', 'error');
                }
            })
            .catch(error => {
                console.error('获取产品信息失败:', error);
                showToast('获取产品信息失败', 'error');
            });
    }

    function saveProduct() {
        const id = document.getElementById('product-id').value;
        const productName = document.getElementById('product-productName').value.trim();
        const productType = parseInt(document.getElementById('product-productType').value);
        const unitPrice = document.getElementById('product-unitPrice').value;
        const costPrice = document.getElementById('product-costPrice').value;
        const defaultRate = document.getElementById('product-defaultRate').value;
        const status = parseInt(document.getElementById('product-status').value);
        const description = document.getElementById('product-description').value.trim();

        if (!productName) {
            showToast('请输入产品名称', 'error');
            return;
        }

        const data = {
            productName: productName,
            productType: productType,
            status: status,
            description: description
        };

        if (unitPrice) data.unitPrice = parseFloat(unitPrice);
        if (costPrice) data.costPrice = parseFloat(costPrice);
        if (defaultRate) data.defaultRate = parseFloat(defaultRate);

        let url = '/api/product/add';
        if (id) {
            url = '/api/product/update';
            data.id = parseInt(id);
        }

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 200) {
                showToast(id ? '更新成功' : '添加成功', 'success');
                productModalInstance.hide();
                loadProductList();
            } else {
                showToast(result.msg || '操作失败', 'error');
            }
        })
        .catch(error => {
            console.error('保存产品失败:', error);
            showToast('保存失败', 'error');
        });
    }

    function deleteProduct(id) {
        if (!confirm('确定要删除该产品吗？')) {
            return;
        }

        fetch(`/api/product/delete/${id}`, {
            method: 'POST'
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 200) {
                showToast('删除成功', 'success');
                loadProductList();
            } else {
                showToast(result.msg || '删除失败', 'error');
            }
        })
        .catch(error => {
            console.error('删除产品失败:', error);
            showToast('删除失败', 'error');
        });
    }
</script>
</body>
</html>
