<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - 后台管理系统' : '后台管理系统'}">后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
</head>
<body>
<div id="wrapper">
    <div id="sidebar-wrapper">
        <div class="sidebar-brand">
            <a href="/">
                <i class="bi bi-gear-wide-connected"></i>
                后台管理系统
            </a>
        </div>
        <div class="sidebar-menu">
            <a href="/" class="menu-item">
                <i class="bi bi-house-door"></i>
                首页
            </a>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-gear"></i>
                系统管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/system/user" class="menu-item">
                    <i class="bi bi-person-circle"></i>
                    系统用户管理
                </a>
                <a href="/system/role" class="menu-item">
                    <i class="bi bi-people-fill"></i>
                    角色管理
                </a>
                <a href="/system/permission" class="menu-item">
                    <i class="bi bi-key-fill"></i>
                    权限管理
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-person-badge"></i>
                用户管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/agent" class="menu-item">
                    <i class="bi bi-building"></i>
                    代理商管理
                </a>
                <a href="/merchant" class="menu-item">
                    <i class="bi bi-shop"></i>
                    商户管理
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-box-seam"></i>
                产品管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/product" class="menu-item">
                    <i class="bi bi-cube"></i>
                    产品信息
                </a>
                <a href="/machine" class="menu-item">
                    <i class="bi bi-hdd"></i>
                    机器信息
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item" onclick="toggleMenu(this)">
                <i class="bi bi-wallet2"></i>
                账户管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu">
                <a href="/agent-account" class="menu-item">
                    <i class="bi bi-credit-card"></i>
                    代理账户
                </a>
                <a href="/profit" class="menu-item">
                    <i class="bi bi-cash-stack"></i>
                    分润信息
                </a>
                <a href="/account-detail" class="menu-item">
                    <i class="bi bi-list-ul"></i>
                    账户明细
                </a>
                <a href="/statement" class="menu-item">
                    <i class="bi bi-file-earmark-text"></i>
                    对账单
                </a>
            </div>

            <a href="javascript:void(0)" class="menu-item active" onclick="toggleMenu(this)">
                <i class="bi bi-exchange"></i>
                交易管理
                <i class="bi bi-chevron-down arrow"></i>
            </a>
            <div class="submenu open">
                <a href="/channel" class="menu-item">
                    <i class="bi bi-link-45deg"></i>
                    通道管理
                </a>
                <a href="/transaction" class="menu-item active">
                    <i class="bi bi-bar-chart-line"></i>
                    交易明细
                </a>
            </div>
        </div>
    </div>

    <div id="content-wrapper">
        <nav class="topbar">
            <div class="topbar-title" th:text="${pageTitle != null ? pageTitle : '交易明细'}">交易明细</div>
            <div class="topbar-user">
                <div class="dropdown">
                    <div class="user-info" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="avatar" th:text="${currentUser != null ? (currentUser.realName != null ? #strings.substring(currentUser.realName, 0, 1) : #strings.substring(currentUser.username, 0, 1)) : '管'}">管</div>
                        <div>
                            <div class="user-name" th:text="${currentUser != null ? (currentUser.realName != null ? currentUser.realName : currentUser.username) : '管理员'}">管理员</div>
                            <div class="user-role" th:text="${currentRole != null ? currentRole : '系统管理员'}">系统管理员</div>
                        </div>
                        <i class="bi bi-chevron-down"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="javascript:void(0)">
                            <i class="bi bi-person-circle"></i> 个人信息
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" style="display: inline;">
                                <button type="submit" class="dropdown-item text-danger" style="border: none; background: none; cursor: pointer; width: 100%; text-align: left;">
                                    <i class="bi bi-box-arrow-right"></i> 退出登录
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div id="page-content">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item">交易管理</li>
                    <li class="breadcrumb-item active">交易明细</li>
                </ol>
            </nav>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <div class="d-flex flex-wrap gap-3">
                                <div>
                                    <label class="form-label small text-muted mb-1">交易编号</label>
                                    <input type="text" class="form-control form-control-sm" id="search-transNo" placeholder="请输入交易编号">
                                </div>
                                <div>
                                    <label class="form-label small text-muted mb-1">商户</label>
                                    <input type="text" class="form-control form-control-sm" id="search-merchantName" placeholder="请输入商户名称">
                                </div>
                                <div>
                                    <label class="form-label small text-muted mb-1">状态</label>
                                    <select class="form-select form-select-sm" id="search-transStatus">
                                        <option value="">全部</option>
                                        <option value="1">成功</option>
                                        <option value="0">失败</option>
                                        <option value="2">处理中</option>
                                    </select>
                                </div>
                                <div class="align-self-end">
                                    <button class="btn btn-primary btn-sm" onclick="searchTransaction()">
                                        <i class="bi bi-search"></i> 查询
                                    </button>
                                    <button class="btn btn-secondary btn-sm ms-2" onclick="resetTransactionSearch()">
                                        <i class="bi bi-arrow-repeat"></i> 重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>交易编号</th>
                                    <th>外部编号</th>
                                    <th>商户</th>
                                    <th>代理商</th>
                                    <th>产品</th>
                                    <th>机器</th>
                                    <th>通道</th>
                                    <th>交易类型</th>
                                    <th>交易金额</th>
                                    <th>手续费</th>
                                    <th>费率</th>
                                    <th>分润</th>
                                    <th>状态</th>
                                    <th>交易时间</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-table">
                                <tr>
                                    <td colspan="14" class="text-center py-3">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <span class="small text-muted">共 <span id="transaction-total">0</span> 条记录</span>
                        </div>
                        <div class="col-auto">
                            <nav id="transaction-pagination"></nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="loading" class="loading">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div class="toast-container">
    <div id="toast" class="toast" role="alert">
        <div class="toast-header">
            <strong class="me-auto" id="toast-title">提示</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toast-message"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script>
    let transactionCurrentPage = 1;
    let transactionPageSize = 10;

    document.addEventListener('DOMContentLoaded', function() {
        loadTransactionList();
    });

    function loadTransactionList() {
        const transNo = document.getElementById('search-transNo').value;
        const merchantName = document.getElementById('search-merchantName').value;
        const status = document.getElementById('search-transStatus').value;

        let url = `/api/transaction/list?pageNum=${transactionCurrentPage}&pageSize=${transactionPageSize}`;
        if (transNo) url += `&transNo=${encodeURIComponent(transNo)}`;
        if (merchantName) url += `&merchantName=${encodeURIComponent(merchantName)}`;
        if (status) url += `&status=${status}`;

        fetch(url)
            .then(response => response.json())
            .then(result => {
                if (result.code === 200) {
                    renderTransactionTable(result.data);
                    renderTransactionPagination(result.total);
                    document.getElementById('transaction-total').textContent = result.total || 0;
                } else {
                    showToast('加载失败: ' + (result.msg || '未知错误'), 'error');
                }
            })
            .catch(error => {
                console.error('加载交易明细列表失败:', error);
                showToast('加载失败', 'error');
            });
    }

    function renderTransactionTable(data) {
        const tbody = document.getElementById('transaction-table');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="14" class="text-center py-3">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(trans => {
            let statusBadge = '';
            if (trans.status === 1) {
                statusBadge = '<span class="badge bg-success">成功</span>';
            } else if (trans.status === 0) {
                statusBadge = '<span class="badge bg-danger">失败</span>';
            } else {
                statusBadge = '<span class="badge bg-warning">处理中</span>';
            }

            const transTypeText = trans.transType === 1 ? '消费' 
                : trans.transType === 2 ? '退款' 
                : trans.transType === 3 ? '撤销' : '其他';

            return `
                <tr>
                    <td>${escapeHtml(trans.transNo || '-')}</td>
                    <td>${escapeHtml(trans.outTransNo || '-')}</td>
                    <td>${escapeHtml(trans.merchantName || '-')}</td>
                    <td>${escapeHtml(trans.agentName || '-')}</td>
                    <td>${escapeHtml(trans.productName || '-')}</td>
                    <td>${escapeHtml(trans.machineNo || '-')}</td>
                    <td>${escapeHtml(trans.channelName || '-')}</td>
                    <td>${transTypeText}</td>
                    <td><span class="text-primary">¥${trans.transAmount || '0.00'}</span></td>
                    <td>¥${trans.feeAmount || '0.00'}</td>
                    <td>${trans.rate || '0.00%'}</td>
                    <td><span class="text-success">¥${trans.profitAmount || '0.00'}</span></td>
                    <td>${statusBadge}</td>
                    <td>${trans.transTime ? formatDateTime(trans.transTime) : '-'}</td>
                </tr>
            `;
        }).join('');
    }

    function renderTransactionPagination(total) {
        const totalPages = Math.ceil(total / transactionPageSize);
        const pagination = document.getElementById('transaction-pagination');

        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = '<ul class="pagination pagination-sm mb-0">';

        html += `<li class="page-item ${transactionCurrentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="goToTransactionPage(${transactionCurrentPage - 1})">上一页</a>
        </li>`;

        for (let i = 1; i <= totalPages && i <= 10; i++) {
            html += `<li class="page-item ${i === transactionCurrentPage ? 'active' : ''}">
                <a class="page-link" href="javascript:void(0)" onclick="goToTransactionPage(${i})">${i}</a>
            </li>`;
        }

        html += `<li class="page-item ${transactionCurrentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="goToTransactionPage(${transactionCurrentPage + 1})">下一页</a>
        </li>`;

        html += '</ul>';
        pagination.innerHTML = html;
    }

    function goToTransactionPage(page) {
        transactionCurrentPage = page;
        loadTransactionList();
    }

    function searchTransaction() {
        transactionCurrentPage = 1;
        loadTransactionList();
    }

    function resetTransactionSearch() {
        document.getElementById('search-transNo').value = '';
        document.getElementById('search-merchantName').value = '';
        document.getElementById('search-transStatus').value = '';
        searchTransaction();
    }
</script>
</body>
</html>
