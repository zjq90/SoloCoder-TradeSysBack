<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #858796;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .login-card {
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1.5rem 0 rgba(58, 59, 69, 0.15);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }

        .login-header {
            background: linear-gradient(180deg, var(--primary-color) 0%, #224abe 100%);
            padding: 2.5rem 2rem;
            text-align: center;
            color: #fff;
        }

        .login-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
        }

        .login-header p {
            margin: 0.5rem 0 0 0;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .login-body {
            padding: 2.5rem 2rem;
        }

        .form-floating {
            margin-bottom: 1rem;
        }

        .form-floating input {
            height: 50px;
            border-radius: 0.5rem;
            border: 1px solid #d1d3e2;
        }

        .form-floating input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }

        .form-floating label {
            color: #858796;
        }

        .btn-login {
            background: linear-gradient(180deg, var(--primary-color) 0%, #224abe 100%);
            border: none;
            color: #fff;
            padding: 0.875rem 1.5rem;
            font-weight: 600;
            border-radius: 0.5rem;
            width: 100%;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: linear-gradient(180deg, #224abe 0%, #1d3ea0 100%);
            transform: translateY(-1px);
            box-shadow: 0 0.25rem 0.75rem rgba(78, 115, 223, 0.3);
        }

        .alert {
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            border: none;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
        }

        .login-footer {
            text-align: center;
            padding: 1.5rem 2rem;
            border-top: 1px solid #e3e6f0;
            background-color: #f8f9fc;
        }

        .login-footer p {
            margin: 0;
            color: #858796;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-gear-wide-connected" style="font-size: 2.5rem; margin-bottom: 0.5rem;"></i>
            <h1>后台管理系统</h1>
            <p>代理商商户交易管理平台</p>
        </div>

        <div class="login-body">
            <div th:if="${error != null}" class="alert alert-danger d-flex align-items-center">
                <i class="bi bi-exclamation-circle" style="margin-right: 0.5rem;"></i>
                <span th:text="${error}"></span>
            </div>

            <div th:if="${logout != null}" class="alert alert-success d-flex align-items-center">
                <i class="bi bi-check-circle" style="margin-right: 0.5rem;"></i>
                <span th:text="${logout}"></span>
            </div>

            <form method="post" action="/login">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mb-3" style="font-size: 0.9rem;">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember-me">
                        <label class="form-check-label text-muted" for="remember">记住我</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> 登 录
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p>演示账号：admin / 123456</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
